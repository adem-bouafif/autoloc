$kind: http-request
url: "{{baseUrl}}/api/equipements"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nom": "GPS",
      "description": "Navigation GPS"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Code HTTP attendu [201]', function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      pm.collectionVariables.set('idEquipement', pm.response.json().idEquipement);
    language: text/javascript
order: 4000
