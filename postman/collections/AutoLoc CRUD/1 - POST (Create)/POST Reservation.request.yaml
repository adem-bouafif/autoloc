$kind: http-request
url: "{{baseUrl}}/api/reservations"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "dateDebut": "2026-11-01",
      "dateFin": "2026-11-05",
      "statut": "CONFIRMEE",
      "client": {
        "idClient": {{idClient}}
      },
      "vehicule": {
        "idVehicule": {{idVehicule}}
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Code HTTP attendu [201]', function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      pm.collectionVariables.set('idReservation', pm.response.json().idReservation);
    language: text/javascript
order: 7000
