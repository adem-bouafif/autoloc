$kind: http-request
url: "{{baseUrl}}/api/maintenances"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "dateDebut": "2026-10-25",
      "dateFin": "2026-10-26",
      "description": "Vidange",
        "vehicule": {
        "idVehicule": {{idVehicule}}
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Code HTTP attendu [201]', function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      pm.collectionVariables.set('idMaintenance', pm.response.json().idMaintenance);
    language: text/javascript
order: 6000
