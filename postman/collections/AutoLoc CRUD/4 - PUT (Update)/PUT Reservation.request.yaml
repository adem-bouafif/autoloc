$kind: http-request
url: "{{baseUrl}}/api/reservations/{{idReservation}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "dateDebut": "2026-11-01",
      "dateFin": "2026-11-07",
      "statut": "CONFIRMEE",
      "client": {
        "idClient": {{idClient}}
      },
      "vehicule": {
        "idVehicule": {{idVehicule}}
      }
    }
scripts:
  - type: afterResponse
    code: pm.test('Code HTTP attendu [200]', function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
order: 7000
