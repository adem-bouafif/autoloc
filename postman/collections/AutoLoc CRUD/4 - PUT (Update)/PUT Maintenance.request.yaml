$kind: http-request
url: "{{baseUrl}}/api/maintenances/{{idMaintenance}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "dateDebut": "2026-10-25",
      "dateFin": "2026-10-26",
      "description": "Vidange et filtres",
        "vehicule": {
        "idVehicule": {{idVehicule}}
      }
    }
scripts:
  - type: afterResponse
    code: pm.test('Code HTTP attendu [200]', function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
order: 6000
