$kind: http-request
url: "{{baseUrl}}/api/contrats/{{idContrat}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "dateSignature": "2026-10-30",
      "valide": true,
      "montantTotal": 650.0,
      "reservation": {
        "idReservation": {{idReservation}}
      }
    }
scripts:
  - type: afterResponse
    code: pm.test('Code HTTP attendu [200]', function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
order: 8000
