$kind: http-request
url: "{{baseUrl}}/api/vehicules/{{idVehicule}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "categorie": "CITADINE",
      "modele": "Clio",
      "tarifJournalier": 80.0,
      "immatriculation": "TUN-{{$timestamp}}",
      "marque": "Peugeot",
      "statut": "DISPONIBLE",
      "agence": {
        "idAgence": {{idAgence}}
      }
    }
scripts:
  - type: afterResponse
    code: pm.test('Code HTTP attendu [200]', function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
order: 5000
