$kind: http-request
url: "{{baseUrl}}/api/employes/{{idEmploye}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nom": "Trabelsi",
      "prenom": "Ines",
      "email": "ines.modif@mail.com",
      "role": "AGENT",
      "agence": {
        "idAgence": {{idAgence}}
      }
    }
scripts:
  - type: afterResponse
    code: pm.test('Code HTTP attendu [200]', function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
order: 3000
