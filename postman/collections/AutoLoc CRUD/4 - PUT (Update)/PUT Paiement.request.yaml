$kind: http-request
url: "{{baseUrl}}/api/paiements/{{idPaiement}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "montant": 650.0,
      "datePaiement": "2026-10-30",
      "modePaiement": "CARTE",
      "contrat": {
        "idContrat": {{idContrat}},
        "valide": true
      }
    }
scripts:
  - type: afterResponse
    code: pm.test('Code HTTP attendu [200]', function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
order: 9000
