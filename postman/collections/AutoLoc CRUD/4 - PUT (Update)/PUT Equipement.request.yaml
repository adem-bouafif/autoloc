$kind: http-request
url: "{{baseUrl}}/api/equipements/{{idEquipement}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nom": "GPS",
      "description": "Navigation GPS mise a jour"
    }
scripts:
  - type: afterResponse
    code: pm.test('Code HTTP attendu [200]', function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
order: 4000
